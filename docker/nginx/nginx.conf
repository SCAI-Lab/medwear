# Upstreams are resolved at request time (cached 10 s), not once at startup:
# with a hostname in proxy_pass, nginx kept the old address of medwear-api after
# the API container was restarted and returned 502 until nginx itself restarted.
# NGINX_LOCAL_RESOLVERS is filled in from /etc/resolv.conf by the nginx image
# entrypoint (NGINX_ENTRYPOINT_LOCAL_RESOLVERS=1); this file is installed as a
# template (/etc/nginx/templates/default.conf.template).
resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
resolver_timeout 5s;

server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    set $medwear_api      http://medwear-api:8080;
    set $medwear_frontend http://medwear-frontend:80;

    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # API
    location /v1/ {
        proxy_pass         $medwear_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        client_max_body_size 1g;
    }

    # Export endpoint — needs longer timeout for large signal datasets
    location ~* ^/v1/data/signals/.+/export {
        proxy_pass         $medwear_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        client_max_body_size 1g;
    }

    # Device batch upload
    location /v1/data/batch {
        proxy_pass         $medwear_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        client_max_body_size 1g;
    }

    # API Docs
    location /docs {
        proxy_pass $medwear_api;
        proxy_set_header Host $host;
    }
    location /redoc {
        proxy_pass $medwear_api;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass $medwear_api;
        proxy_set_header Host $host;
    }

    # Frontend
    location / {
        proxy_pass       $medwear_frontend;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
