apiVersion: 1

datasources:
  - name: InfluxDB
    type: influxdb
    access: proxy
    url: http://medwear-influxdb:8086
    uid: influxdb-medwear
    isDefault: false
    jsonData:
      version: Flux
      organization: medwear
      defaultBucket: medwear
    secureJsonData:
      token: ${INFLUX_TOKEN}
    editable: true
